<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        html,
        body{
            margin:0;
            padding:0;
            background:transparent;
            overflow:hidden;
            font-family:Arial, Helvetica, sans-serif;
        }

        .container{
            display:inline-block;
            padding:5px;
        }

        .bmi-card{
            background:#EEF4F8;
            border:1px solid #C9D8E3;
            border-radius:12px;
            padding:24px;
            text-align:center;
            display:inline-block;
        }

        .title{
            color:#6E8FA8;
            font-size:18px;
            font-weight:600;
            margin-bottom:12px;
        }

        .bmi-value{
            color:#3F3A36;
            font-size:42px;
            font-weight:700;
            line-height:1;
            margin-bottom:12px;
        }

        .copy-btn{
            background:#FFFFFF;
            border:1px solid #D8D0C9;
            border-radius:8px;
            padding:8px 12px;
            cursor:pointer;
            color:#7C6253;
            font-size:14px;
            transition:all 0.2s ease;
        }

        .copy-btn:hover{
            background:#F7F4F1;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="bmi-card">

        <div class="title">
            📊 Your BMI
        </div>

        <div id="bmi-res" class="bmi-value">
            --
        </div>

        <button class="copy-btn"
                onclick="copyBMI(this)">
            <i class="fa-regular fa-copy"></i>
            Copy BMI
        </button>

    </div>

</div>

<script>

function calculateBMI(weight, height){

    const weightKg = parseFloat(weight);
    const heightM = parseFloat(height) / 100;

    if(
        isNaN(weightKg) ||
        isNaN(heightM) ||
        heightM <= 0
    ){
        return;
    }

    const bmi = weightKg / (heightM * heightM);

    document.getElementById('bmi-res').innerText =
        bmi.toFixed(1);
}

function copyBMI(btn){

    const value =
        document.getElementById('bmi-res').innerText;

    if(value !== "--"){

        navigator.clipboard.writeText(value);

        btn.innerHTML =
            '<i class="fa-solid fa-check"></i> Copied';

        setTimeout(() => {

            btn.innerHTML =
                '<i class="fa-regular fa-copy"></i> Copy BMI';

        }, 2000);
    }
}

const params = new URLSearchParams(window.location.search);

const weight = params.get('weight');
const height = params.get('height');

if(weight && height){
    calculateBMI(weight, height);
}

</script>

</body>

</html>
